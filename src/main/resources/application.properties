spring.application.name=chef-renting-system-api
server.port=8080

# In-memory H2 database: nothing to install; the seed CSV is loaded again on every start.
spring.datasource.url=jdbc:h2:mem:chefrenting;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# Dates are written as yyyy-MM-dd strings.
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Europe/Budapest

# Allowed origin of the Angular frontend (later task).
app.cors.allowed-origins=http://localhost:4200

# Seed data (classpath), UTF-8, semicolon separated.
app.seed.file=data/chef_berlesek_api.csv
